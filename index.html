<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mum's Quizmaster</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap');
  :root{--cream:#fdf6e8;--brown:#5c3d1e;--gold:#c8922a;--dgold:#9a6e1a;--green:#3a5f3a;--lgreen:#e6f0e6;--red:#8b3a3a;--lred:#fceaea;--white:#ffffff;--shadow:rgba(92,61,30,0.12)}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--cream);font-family:'Lato',Georgia,sans-serif;color:var(--brown);background-image:radial-gradient(ellipse at 15% 5%,rgba(200,146,42,.07) 0%,transparent 50%),radial-gradient(ellipse at 85% 95%,rgba(58,95,58,.05) 0%,transparent 50%)}
  #shell{display:flex;flex-direction:column;height:100vh;padding:10px 14px 6px;gap:8px}
  #hdr{flex:0 0 auto;text-align:center;padding:4px 0 2px}
  #hdr h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(1.5rem,4vw,2.2rem);font-weight:900;line-height:1;color:var(--brown)}
  #hdr h1 span{color:var(--gold)}
  #hdr p{font-size:clamp(0.75rem,1.6vw,0.9rem);color:var(--dgold);font-style:italic;margin-top:2px}
  .divider{width:80px;height:2px;background:linear-gradient(to right,transparent,var(--gold),transparent);margin:4px auto}
  #card{flex:1 1 0;background:var(--white);border-radius:14px;border:1px solid rgba(200,146,42,.18);box-shadow:0 3px 18px var(--shadow);overflow:hidden;display:flex;flex-direction:column}
  .screen{display:none;flex-direction:column;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 22px 14px}
  .screen.active{display:flex}
  #s-topic h2{font-family:'Playfair Display',serif;font-size:clamp(1.1rem,2.8vw,1.5rem);margin-bottom:4px}
  #s-topic>p{font-size:clamp(0.8rem,1.7vw,0.95rem);color:#666;line-height:1.5;margin-bottom:12px}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;margin-bottom:12px}
  .topic-btn{background:var(--lgreen);border:2px solid transparent;border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;transition:all 0.18s ease;font-family:'Lato',sans-serif;display:flex;flex-direction:column;justify-content:center}
  .topic-btn:hover,.topic-btn.sel{border-color:var(--green);background:#cfe3cf;transform:translateY(-1px);box-shadow:0 3px 10px rgba(58,95,58,.18)}
  .topic-btn .ico{font-size:clamp(1.4rem,3vw,1.9rem);margin-bottom:4px;display:block}
  .topic-btn .lbl{font-size:clamp(0.85rem,1.8vw,1rem);font-weight:700;color:var(--brown);display:block}
  .topic-btn .dsc{font-size:clamp(0.7rem,1.4vw,0.82rem);color:#666;display:block;margin-top:2px;line-height:1.3}
  .start-btn{width:100%;background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px;font-family:'Playfair Display',serif;font-size:clamp(1rem,2.2vw,1.3rem);cursor:pointer;transition:all 0.18s;letter-spacing:.3px}
  .start-btn:hover:not(:disabled){background:#2d4d2d}
  .start-btn:disabled{opacity:.35;cursor:not-allowed}
  .voice-note{text-align:center;font-size:clamp(.65rem,1.3vw,.78rem);color:#bbb;font-style:italic;margin-top:6px}
  #s-quiz{gap:0;padding:14px 20px 10px}
  .score-bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid rgba(200,146,42,.2);margin-bottom:10px;flex-shrink:0;flex-wrap:wrap;gap:6px}
  .score-pill{background:var(--lgreen);border-radius:20px;padding:4px 14px;font-size:clamp(.8rem,1.6vw,.95rem);font-weight:700;color:var(--green)}
  .q-count{font-size:clamp(.7rem,1.4vw,.85rem);color:#999;font-style:italic}
  .topic-tag{font-size:clamp(.65rem,1.3vw,.78rem);color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
  .spk-bar{display:none;align-items:center;gap:8px;padding:7px 12px;background:rgba(200,146,42,.09);border-radius:8px;border-left:3px solid var(--gold);margin-bottom:8px;flex-shrink:0}
  .spk-bar.on{display:flex}
  .waves span{display:inline-block;width:3px;height:14px;background:var(--gold);border-radius:2px;margin:0 2px;animation:wv .8s ease-in-out infinite}
  .waves span:nth-child(2){animation-delay:.1s;height:18px}
  .waves span:nth-child(3){animation-delay:.2s;height:10px}
  .waves span:nth-child(4){animation-delay:.3s;height:16px}
  @keyframes wv{0%,100%{transform:scaleY(1);opacity:.7}50%{transform:scaleY(.4);opacity:1}}
  .spk-bar p{font-size:clamp(.7rem,1.4vw,.82rem);color:var(--dgold);font-style:italic}
  #q-text{font-family:'Playfair Display',serif;font-size:clamp(1rem,2.4vw,1.35rem);line-height:1.5;color:var(--brown);margin-bottom:12px;flex-shrink:0}
  .opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px;flex-shrink:0}
  .opt-btn{background:var(--cream);border:2px solid rgba(200,146,42,.28);border-radius:9px;padding:clamp(10px,1.8vh,14px) 14px;font-family:'Lato',sans-serif;font-size:clamp(.82rem,1.7vw,.98rem);color:var(--brown);cursor:pointer;text-align:left;transition:all .18s;line-height:1.35}
  .opt-btn:hover:not(:disabled){border-color:var(--gold);background:rgba(200,146,42,.07);transform:translateY(-1px)}
  .opt-btn.correct{background:#e8f5e8;border-color:var(--green);color:var(--green);font-weight:700}
  .opt-btn.wrong{background:var(--lred);border-color:var(--red);color:var(--red)}
  .opt-btn:disabled{cursor:default}
  #fb-box{display:none;padding:12px 16px;border-radius:10px;margin-bottom:10px;flex-shrink:0;line-height:1.5}
  #fb-box.correct{background:#e8f5e8;border-left:4px solid var(--green);color:var(--green)}
  #fb-box.wrong{background:var(--lred);border-left:4px solid var(--red);color:var(--red)}
  .fb-emoji{font-size:clamp(1.2rem,2.5vw,1.6rem);display:block;margin-bottom:5px}
  .fb-main{font-family:'Playfair Display',serif;font-size:clamp(.92rem,2vw,1.1rem);font-weight:700}
  .fb-fact{font-size:clamp(.78rem,1.6vw,.9rem);margin-top:4px;color:#333;line-height:1.5}
  .btn-row{display:flex;gap:10px;flex-shrink:0;margin-top:auto;padding-top:6px}
  .btn-speak{background:rgba(200,146,42,.1);border:2px solid var(--gold);color:var(--dgold);border-radius:9px;padding:10px 14px;font-size:clamp(1rem,2vw,1.25rem);cursor:pointer;transition:all .18s;flex-shrink:0}
  .btn-speak:hover{background:rgba(200,146,42,.22)}
  .btn-next{flex:1;display:none;background:var(--brown);color:#fff;border:none;border-radius:9px;padding:10px;font-family:'Playfair Display',serif;font-size:clamp(.9rem,1.9vw,1.1rem);cursor:pointer;transition:all .18s}
  .btn-next:hover{background:#3d2810}
  #s-end{align-items:center;justify-content:center;text-align:center;gap:10px}
  #s-end .trophy{font-size:clamp(2.5rem,7vw,4rem)}
  #s-end h2{font-family:'Playfair Display',serif;font-size:clamp(1.4rem,3.5vw,2rem)}
  .final-score{font-size:clamp(2rem,5vw,3rem);font-weight:900;color:var(--gold);font-family:'Playfair Display',serif}
  .score-lbl{font-size:clamp(.8rem,1.7vw,1rem);color:#888}
  .end-msg{font-size:clamp(.85rem,1.8vw,1.05rem);color:#555;font-style:italic;line-height:1.6;max-width:480px}
  .btn-restart{background:var(--green);color:#fff;border:none;border-radius:10px;padding:14px 36px;font-family:'Playfair Display',serif;font-size:clamp(.95rem,2vw,1.2rem);cursor:pointer;transition:all .18s}
  .btn-restart:hover{background:#2d4d2d}
</style>
</head>
<body>
<div id="shell">
  <div id="hdr">
    <h1>The <span>Quizmaster</span></h1>
    <div class="divider"></div>
    <p>Questions read aloud &mdash; just listen and tap your answer</p>
  </div>
  <div id="card">
    <div id="s-topic" class="screen active">
      <h2>Choose your topic</h2>
      <p>Pick a subject, then press <em>Start the Quiz</em>.</p>
      <div class="topic-grid">
        <button class="topic-btn" data-t="garden"    onclick="pick(this)"><span class="ico">&#127801;</span><span class="lbl">Gardening</span><span class="dsc">Flowers, plants &amp; the seasons</span></button>
        <button class="topic-btn" data-t="history"   onclick="pick(this)"><span class="ico">&#9876;</span><span class="lbl">English History</span><span class="dsc">Kings, queens &amp; great events</span></button>
        <button class="topic-btn" data-t="houses"    onclick="pick(this)"><span class="ico">&#127984;</span><span class="lbl">Historic Houses</span><span class="dsc">Stately homes &amp; castles</span></button>
        <button class="topic-btn" data-t="radio4"    onclick="pick(this)"><span class="ico">&#128251;</span><span class="lbl">BBC Radio 4</span><span class="dsc">Programmes &amp; The Archers</span></button>
        <button class="topic-btn" data-t="nature"    onclick="pick(this)"><span class="ico">&#127853;</span><span class="lbl">Nature &amp; Wildlife</span><span class="dsc">Birds, seasons &amp; countryside</span></button>
        <button class="topic-btn" data-t="northeast" onclick="pick(this)"><span class="ico">&#9962;</span><span class="lbl">The North East</span><span class="dsc">Newcastle, Durham &amp; Northumberland</span></button>
      </div>
      <button class="start-btn" id="start-btn" onclick="startQuiz()" disabled>Start the Quiz</button>
      <p class="voice-note">Please make sure your sound is turned on for spoken questions</p>
    </div>
    <div id="s-quiz" class="screen">
      <div class="score-bar">
        <div class="score-pill" id="score-el">Score: 0</div>
        <div class="q-count" id="qcount-el">Question 1 of 10</div>
        <div class="topic-tag" id="ttag-el"></div>
      </div>
      <div class="spk-bar" id="spk-bar">
        <div class="waves"><span></span><span></span><span></span><span></span></div>
        <p>Reading question aloud&hellip;</p>
      </div>
      <div id="q-text"></div>
      <div class="opts-grid" id="opts-grid"></div>
      <div id="fb-box"></div>
      <div class="btn-row">
        <button class="btn-speak" onclick="speakQ()" title="Hear again">&#128266;</button>
        <button class="btn-next" id="next-btn" onclick="nextQ()">Next Question</button>
      </div>
    </div>
    <div id="s-end" class="screen">
      <div class="trophy" id="trophy-el">&#127942;</div>
      <h2 id="end-h"></h2>
      <div class="final-score" id="fscore-el">0/10</div>
      <div class="score-lbl">correct answers</div>
      <p class="end-msg" id="end-msg-el"></p>
      <button class="btn-restart" onclick="reset()">&#128260; Play Again</button>
    </div>
  </div>
</div>
<script>
var BANK={
garden:[
{q:"Which flower is sometimes called 'the queen of flowers' and was the symbol of both warring houses in the Wars of the Roses?",opts:["Dahlia","Rose","Sweet Pea","Lily"],ans:1,praise:"Quite right — the rose!",comfort:"It's the rose, our most beloved flower.",fact:"The red rose was the badge of Lancaster, the white rose of York — which is why, after the two houses united, the Tudor Rose combined both colours. Yorkshire still celebrates the white rose to this day."},
{q:"Sweet peas are cherished in English cottage gardens. What quality makes them especially prized by gardeners?",opts:["Their thornless stems","Their wonderful scent","Their speed of growth","Their very long vase life"],ans:1,praise:"Spot on — their heavenly scent!",comfort:"It's their wonderful fragrance.",fact:"Sweet peas were introduced to Britain from Sicily in the late 1600s and became enormously fashionable in Edwardian times. Picking them regularly is the secret to keeping them flowering for months."},
{q:"Which landscape gardener, known as 'Capability Brown', transformed over 170 English estates in the 18th century?",opts:["Humphry Repton","Alan Titchmarsh","Lancelot Brown","William Kent"],ans:2,praise:"Brilliant — Lancelot Brown, known as Capability Brown!",comfort:"It was Lancelot Brown — always called Capability Brown.",fact:"Brown earned his famous nickname because he always told wealthy clients their estates had great 'capabilities' for improvement. His sweeping naturalistic landscapes replaced formal gardens at Chatsworth, Blenheim, and Petworth among many others."},
{q:"The Chelsea Flower Show takes place in the grounds of the Royal Hospital Chelsea every year. In which month is it held?",opts:["March","September","May","July"],ans:2,praise:"Correct — it's held in May!",comfort:"It's held in May.",fact:"The Chelsea Flower Show has been held in the grounds of the Royal Hospital since 1913, interrupted only by two World Wars. A ticket to the private evening preview is one of the most coveted invitations in London."},
{q:"Which tall cottage garden plant, beloved by bumblebees, gave science the heart medicine digitalis?",opts:["Hollyhock","Lupin","Foxglove","Delphinium"],ans:2,praise:"Quite right — the foxglove!",comfort:"It's the beautiful foxglove.",fact:"Digitalis purpurea — the common foxglove — was identified as a heart medicine by physician William Withering in 1785. The drug digoxin, still used today to treat heart conditions, comes directly from this British wildflower."},
{q:"Which fragrant climbing plant, producing hanging clusters of lilac or white flowers, was brought to Britain from China and Japan in the early 19th century?",opts:["Clematis","Wisteria","Honeysuckle","Virginia Creeper"],ans:1,praise:"Quite right — wisteria!",comfort:"It's wisteria.",fact:"The famous Japanese wisteria at Kew Gardens was planted in 1816 and is now over 200 years old. Wisteria can live for centuries — some plants in Japan are considered national treasures."},
{q:"In gardening, 'deadheading' means removing which part of a plant?",opts:["Dead leaves at the base","Spent or faded flowers","Suckers from the roots","Brown tips of leaves"],ans:1,praise:"Exactly right!",comfort:"It means removing the faded flowers.",fact:"Deadheading tricks the plant into producing more flowers instead of setting seed. On roses and sweet peas, regular deadheading can keep blooms coming from June all the way through to the first frosts of autumn."},
{q:"Tulip bulbs need to be planted in which season to produce a beautiful spring display in the garden?",opts:["Spring","Summer","Autumn","Midwinter"],ans:2,praise:"Spot on — plant them in autumn!",comfort:"Autumn is the time to plant them.",fact:"Tulips originated in Central Asia and need a cold winter dormancy to flower well. Planting in October and November gives them the cold period they need — and by April the garden rewards you with a blaze of colour."},
{q:"Garden designer Gertrude Jekyll created over 400 gardens. She is especially famous for her painterly use of which design element?",opts:["Topiary and clipped hedges","Colour — using plants like an artist's palette","Water features and fountains","Kitchen gardens and vegetables"],ans:1,praise:"Perfectly right — her use of colour!",comfort:"It was her brilliant use of colour.",fact:"Gertrude Jekyll trained originally as an artist and approached planting design like painting. Her long herbaceous borders — building from pale yellows at each end through to hot reds in the centre — transformed British garden design."},
{q:"The famous White Garden at Sissinghurst Castle in Kent, using only white and silver-leaved plants, was created by which gardening writer?",opts:["Penelope Hobhouse","Beth Chatto","Vita Sackville-West","Margery Fish"],ans:2,praise:"Well remembered — Vita Sackville-West!",comfort:"It was Vita Sackville-West.",fact:"Vita Sackville-West and her husband Harold Nicolson created the garden at Sissinghurst from a derelict castle from 1930 onwards. The White Garden, planted in the 1950s, has since inspired white gardens all over the world."}
],
history:[
{q:"Queen Victoria reigned from 1837 to 1901 — 63 years. Which year did she come to the throne?",opts:["1830","1837","1840","1845"],ans:1,praise:"Quite right — 1837!",comfort:"She came to the throne in 1837.",fact:"Victoria was just 18 years old when she became queen, and she went on to reign longer than any British monarch before her — until Queen Elizabeth II surpassed her record in 2015. Victoria was grandmother to Kaiser Wilhelm II of Germany and Tsar Nicholas II of Russia."},
{q:"The Battle of Hastings in 1066 changed English history forever. On which date in October did it take place?",opts:["1st October","9th October","14th October","25th October"],ans:2,praise:"Absolutely right — 14th October 1066!",comfort:"It was the 14th of October.",fact:"The battle lasted roughly nine hours, from about 9am until dusk. King Harold II was killed — most likely by an arrow, though the famous image from the Bayeux Tapestry shows this rather than proves it. William the Conqueror was crowned on Christmas Day 1066."},
{q:"Henry VIII famously had six wives. Which Spanish princess was his first queen, and remained married to him for over 20 years?",opts:["Anne Boleyn","Catherine Howard","Catherine of Aragon","Jane Seymour"],ans:2,praise:"Well remembered — Catherine of Aragon!",comfort:"It was Catherine of Aragon.",fact:"Catherine of Aragon was first married to Henry's elder brother Prince Arthur in 1501, but Arthur died just months later. She then married Henry in 1509 and remained queen for 24 years before Henry sought an annulment, sparking the English Reformation."},
{q:"The Magna Carta was sealed at Runnymede meadow in 1215. Which king was forced to agree to it by his barons?",opts:["King Henry II","King John","King Richard I","King Henry III"],ans:1,praise:"Quite correct — King John!",comfort:"It was King John.",fact:"King John sealed the Magna Carta on 15 June 1215. It established for the first time that the king was subject to the rule of law — a principle that underpins British and American constitutional law to this day. Four original copies survive, two in the British Library."},
{q:"Florence Nightingale transformed nursing during which 19th century war, reducing death rates at her hospital from 42% to around 2%?",opts:["The Boer War","The Crimean War","The Napoleonic Wars","The First World War"],ans:1,praise:"Correct — the Crimean War!",comfort:"It was during the Crimean War.",fact:"Florence Nightingale arrived at Scutari hospital in 1854 with 38 nurses. She discovered that most deaths were caused by poor sanitation rather than battle wounds — and her meticulous record-keeping helped prove it. She also pioneered the use of statistics to improve medical care."},
{q:"Victory in Europe Day — VE Day — was celebrated with enormous street parties across Britain on which date in 1945?",opts:["1st May 1945","8th May 1945","15th May 1945","4th June 1945"],ans:1,praise:"Spot on — 8th May 1945!",comfort:"It was 8th May 1945.",fact:"On VE Day, King George VI and Queen Elizabeth appeared eight times on the Buckingham Palace balcony to acknowledge the crowds. Winston Churchill told the assembled people: 'This is your victory!' — to which the crowd roared back: 'No — it is yours!'"},
{q:"The Great Fire of London broke out in Pudding Lane on the 2nd of September in which year?",opts:["1605","1666","1715","1752"],ans:1,praise:"Well done — 1666!",comfort:"It was in 1666.",fact:"The fire burned for four days and nights, destroying 13,200 houses, 87 churches, and St Paul's Cathedral — yet the death toll recorded at the time was remarkably low, perhaps only six people. Samuel Pepys famously described seeing the sky over London turned completely red."},
{q:"When the Spanish Armada threatened England in 1588, which queen delivered a famous speech to troops at Tilbury?",opts:["Mary I","Mary Queen of Scots","Elizabeth I","Anne Boleyn"],ans:2,praise:"Correct — Elizabeth I!",comfort:"It was the great Elizabeth I.",fact:"Elizabeth I rode to the troops at Tilbury in Essex and declared: 'I know I have the body of a weak and feeble woman, but I have the heart and stomach of a king.' The Armada was wrecked less by English guns than by violent storms in the North Sea."},
{q:"The Duke of Wellington defeated Napoleon at the Battle of Waterloo in 1815. Wellington later served twice as British what?",opts:["Lord High Admiral","Prime Minister","Lord Chancellor","Foreign Secretary"],ans:1,praise:"Quite right — he became Prime Minister!",comfort:"He became Prime Minister.",fact:"Wellington served as Prime Minister from 1828 to 1830, though he was far better suited to the battlefield than to politics. He also gave his name to Wellington boots — he asked his shoemaker to adapt the Hessian boot into a more practical design, and they became fashionable across England."},
{q:"Henry VIII's dissolution of the monasteries between 1536 and 1541 left many beautiful ruins across England. How many monasteries were closed in total?",opts:["Around 80","Around 200","Around 500","Around 800"],ans:3,praise:"Quite right — about 800!",comfort:"Around 800 monasteries were closed.",fact:"The dissolution transferred enormous wealth from the Church to the Crown. The ruins of places like Fountains Abbey in Yorkshire, Tintern Abbey in Wales, and Lindisfarne Priory in Northumberland are among the most atmospheric sights in England."}
],
houses:[
{q:"Alnwick Castle in Northumberland served as a filming location for which famous film series, beginning in the year 2000?",opts:["The Lord of the Rings","Downton Abbey","Harry Potter","Braveheart"],ans:2,praise:"Absolutely right — Harry Potter!",comfort:"It was used for Harry Potter.",fact:"Alnwick's outer bailey was used for the first broomstick flying lesson in Harry Potter and the Philosopher's Stone. The castle has belonged to the Percy family — the Dukes of Northumberland — since 1309, making it one of England's longest-inhabited fortresses."},
{q:"Castle Howard in North Yorkshire was the filming location for the 1981 television adaptation of which Evelyn Waugh novel?",opts:["Howards End","The Remains of the Day","Brideshead Revisited","Gosford Park"],ans:2,praise:"Well remembered — Brideshead Revisited!",comfort:"It was used for Brideshead Revisited.",fact:"Castle Howard was designed by Sir John Vanbrugh and Nicholas Hawksmoor beginning in 1699 — it was Vanbrugh's very first architectural commission. Remarkably, it has a dome that predates the rebuilt St Paul's Cathedral. The Howard family still live there today."},
{q:"Chatsworth House in Derbyshire, one of England's grandest stately homes, is the seat of which ducal family?",opts:["The Spencer family","The Cavendish family, Dukes of Devonshire","The Howard family, Dukes of Norfolk","The Percy family, Dukes of Northumberland"],ans:1,praise:"Perfectly right — the Cavendish family!",comfort:"It's the Cavendish family.",fact:"The Cavendish family have lived at Chatsworth since 1549. The 6th Duke employed Joseph Paxton, who designed the Great Conservatory there — an experience that inspired Paxton's later masterpiece, the Crystal Palace for the Great Exhibition of 1851."},
{q:"Spectacular Bamburgh Castle on the Northumberland coast stands on an outcrop of which volcanic rock?",opts:["Granite","Limestone","Basalt","Sandstone"],ans:2,praise:"Quite right — it sits on basalt!",comfort:"It stands on volcanic basalt rock.",fact:"Bamburgh was the royal stronghold of the ancient kingdom of Northumbria. Grace Darling — the lighthouse keeper's daughter who rowed through mountainous seas to rescue shipwreck survivors in 1838 — is buried in the churchyard of the nearby village."},
{q:"Hadrian's Wall was built across northern Britain in 122 AD. How long is it from the Solway Firth to Wallsend on the Tyne?",opts:["55 miles","73 miles","90 miles","110 miles"],ans:1,praise:"Spot on — 73 miles!",comfort:"It stretches for 73 miles.",fact:"Hadrian's Wall was built in just six years by Roman legionary soldiers — an extraordinary feat of engineering across boggy moorland. The name Wallsend (Segedunum in Latin) means exactly what it says: it was built at the eastern end of the wall, where it met the River Tyne."},
{q:"Durham Cathedral, a UNESCO World Heritage Site, is famous as the resting place of which Northumbrian saint who died in 687 AD?",opts:["St Aidan","St Cuthbert","St Bede","St Wilfrid"],ans:1,praise:"Correct — Saint Cuthbert!",comfort:"Saint Cuthbert rests there.",fact:"Cuthbert was the most venerated saint in medieval England. After his death on Lindisfarne, his monks carried his remains around Northumbria for 120 years to protect them from Viking raids before finally settling in Durham in 995."},
{q:"Blenheim Palace in Oxfordshire was given to the first Duke of Marlborough after his victory in 1704. Which future Prime Minister was born there in 1874?",opts:["Lloyd George","Clement Attlee","Winston Churchill","Stanley Baldwin"],ans:2,praise:"Absolutely right — Winston Churchill!",comfort:"It was Winston Churchill.",fact:"Churchill was born prematurely at Blenheim on 30 November 1874 during a ball. He is buried in the simple churchyard at Bladon, close to the palace, as he wished. Blenheim is the only non-royal, non-episcopal house in England to hold the title 'Palace.'"},
{q:"The Lindisfarne Gospels, created around 715 AD by the monk Eadfrith, are now kept in which great library?",opts:["The Bodleian Library, Oxford","The British Library, London","The National Library of Scotland","Durham University Library"],ans:1,praise:"Quite right — the British Library!",comfort:"They are in the British Library in London.",fact:"Eadfrith almost certainly worked alone, spending years on the manuscript. Each elaborate 'carpet page' would have taken months of meticulous work. The Gospels were probably meant for display on the high altar on feast days rather than for reading."},
{q:"Wallington Hall in Northumberland has a famous central hall decorated with eight large paintings of Northumbrian history. Who commissioned and funded the project?",opts:["The Duke of Northumberland","Walter Calverley Trevelyan and his wife Pauline","The National Trust","The Royal Academy"],ans:1,praise:"Well done — the Trevelyans!",comfort:"It was Walter and Pauline Trevelyan.",fact:"Pauline Trevelyan was a brilliant patron of the arts who brought together Ruskin, Rossetti, and other Pre-Raphaelite artists at Wallington. She oversaw the painting of the central hall herself. Wallington was given to the National Trust in 1941."},
{q:"Seaton Delaval Hall in Northumberland was designed by Sir John Vanbrugh. It was largely gutted by fire in which year?",opts:["1756","1798","1822","1860"],ans:2,praise:"Quite right — 1822!",comfort:"The fire was in 1822.",fact:"The fire left Seaton Delaval as a dramatic roofless shell for nearly 200 years. The National Trust acquired it in 2009 and has carefully consolidated and opened the ruins to the public. Vanbrugh, who also designed Castle Howard and Blenheim, began his career as a playwright."}
],
radio4:[
{q:"The Archers, the world's longest-running radio drama, was first broadcast on BBC Radio 4 in January of which year?",opts:["1945","1951","1957","1963"],ans:1,praise:"Right first time — 1951!",comfort:"It first aired in 1951.",fact:"The Archers was originally devised as an educational programme to help British farmers modernise after the war. It is set in the fictional village of Ambridge in Borsetshire — and the programme still employs an agricultural story editor to keep the farming details accurate."},
{q:"On Desert Island Discs, each castaway chooses eight records. What two other things are they also allowed to take?",opts:["A book and a luxury item","A pet and a photograph","A tool and a memento","A friend and a blanket"],ans:0,praise:"Quite right — a book and a luxury!",comfort:"It's a book and a luxury item.",fact:"The Bible and the complete works of Shakespeare are provided automatically, so the book must be something different. The programme was created by Roy Plomley in 1942. Kirsty Young and Lauren Laverne are among its much-loved recent presenters."},
{q:"In the Radio 4 panel game Just a Minute, players must speak for 60 seconds without hesitation, repetition, or what third offence?",opts:["Mispronunciation","Swearing","Deviation","Speaking too quietly"],ans:2,praise:"Absolutely right — deviation!",comfort:"The third rule is no deviation.",fact:"Just a Minute was created by Ian Messiter, who said the idea came to him in a dream about a strict schoolmaster. It has been broadcast since 1967 and is associated above all with the late Nicholas Parsons, who chaired the show for over 50 years."},
{q:"Melvyn Bragg has presented In Our Time — Radio 4's programme exploring the history of ideas — since which year?",opts:["1990","1994","1998","2003"],ans:2,praise:"Quite correct — 1998!",comfort:"It began in 1998.",fact:"Melvyn Bragg was born in Wigton in Cumbria and has spoken of the North of England as the great influence on his intellectual life. In Our Time has covered everything from the Black Death to the Fibonacci sequence — and Bragg famously reads extensively before each programme."},
{q:"Woman's Hour first broadcast on BBC radio in which year — making it one of the world's longest-running programmes for women?",opts:["1940","1946","1952","1958"],ans:1,praise:"Spot on — 1946!",comfort:"It began in 1946.",fact:"Woman's Hour began on the BBC Home Service in October 1946 and moved to Radio 4 when that network launched. It has tackled everything from recipes in its early days to groundbreaking investigations of equal pay, domestic violence, and women's health."},
{q:"Which brief Radio 4 programme, broadcast at 6:55 each weekday morning, celebrates a different British bird with a recording of its song?",opts:["Thought for the Day","Nature Notes","Tweet of the Day","The Dawn Chorus"],ans:2,praise:"Well remembered — Tweet of the Day!",comfort:"It's Tweet of the Day.",fact:"Tweet of the Day began in 2013 to mark the centenary of the British Trust for Ornithology. Each episode is just two minutes long — a recording of the bird followed by a beautifully written description. It has introduced many listeners to birds they had never noticed in their own gardens."},
{q:"Who created Desert Island Discs in 1942 and presented it himself for over 40 years?",opts:["Richard Dimbleby","Roy Plomley","Alistair Cooke","Franklin Engelmann"],ans:1,praise:"Correct — Roy Plomley!",comfort:"It was Roy Plomley.",fact:"Roy Plomley presented Desert Island Discs from its first broadcast in January 1942 until shortly before his death in 1985 — 43 years. His first castaway was the comedian Vic Oliver, chosen simply because he was the only person Plomley could reach by telephone at the time."},
{q:"In The Archers, which long-suffering Ambridge family — famous for their misfortunes and association with pigs — includes the characters Eddie and Joe?",opts:["The Aldridges","The Grundys","The Archers themselves","The Carters"],ans:1,praise:"Quite right — the Grundys!",comfort:"It's the much-loved Grundy family.",fact:"The Grundys have been a central part of The Archers since 1953. Eddie's aspiration to become a country music star, and Joe's magnificent stubbornness, have made them among the most popular characters in the programme's history."},
{q:"Radio 4's flagship morning news programme, Today, is broadcast between which hours on weekday mornings?",opts:["5am to 7am","6am to 9am","7am to 10am","8am to 11am"],ans:1,praise:"Spot on — 6am to 9am!",comfort:"It runs from 6 to 9 in the morning.",fact:"The Today programme began in 1957 and is now one of the most influential news broadcasts in Britain — politicians speak of 'a difficult Today interview' as something to be feared. Its presenters have included John Humphrys, Brian Redhead, and Sarah Montague."},
{q:"Radio 4's famous Shipping Forecast is broadcast four times daily. What comes immediately before the late-night reading at around 00:48?",opts:["The World Tonight","Sailing By — a gentle piece of light music","The National Anthem","A BBC News summary"],ans:1,praise:"Well remembered — Sailing By!",comfort:"It's preceded by Sailing By.",fact:"Sailing By — a waltz composed by Ronald Binge in 1963 — plays before the late-night Shipping Forecast to allow ships' radio operators to tune in and prepare. Countless landlocked listeners across Britain have found it the most soothing piece of music imaginable for falling asleep to."}
],
nature:[
{q:"The robin, often called Britain's unofficial national bird, was voted the nation's favourite bird in a public poll in 2015. Who organised the poll?",opts:["The RSPB","The Wildlife Trusts","David Lindo, the Urban Birder","The National Trust"],ans:2,praise:"Quite right — David Lindo organised the poll!",comfort:"It was a poll organised by birdwatcher David Lindo.",fact:"David Lindo's nationwide poll attracted over 200,000 votes — the robin won with 34% of the vote, ahead of the barn owl, blackbird, and puffin. The robin has long been associated with Christmas cards because Victorian postmen wore red uniforms and were nicknamed 'Robins.'"},
{q:"Britain is home to approximately what fraction of the entire world's population of native bluebells?",opts:["One tenth","One quarter","One third","One half"],ans:3,praise:"Spot on — roughly half!",comfort:"Britain holds about half the world's bluebells.",fact:"The native English bluebell (Hyacinthoides non-scripta) is under threat from the Spanish bluebell, an introduced species which hybridises with it. It is protected by law in Britain — it is illegal to dig up wild bluebells. Ancient bluebell woods are a sign of long-undisturbed countryside."},
{q:"Red squirrels have been displaced across most of England by the American grey squirrel, which was introduced to Britain in which decade?",opts:["The 1850s","The 1870s","The 1910s","The 1930s"],ans:1,praise:"Quite right — the 1870s!",comfort:"They arrived in the 1870s.",fact:"The first grey squirrels were released at Henbury Park in Cheshire in 1876. Red squirrels survive in Northumberland (particularly Kielder Forest), the Lake District, and some Scottish islands — places where active conservation keeps the greys at bay."},
{q:"Hedgehog numbers in Britain have fallen dramatically since the 1950s. Approximately how many hedgehogs are thought to remain in Britain today?",opts:["Around 30 million","Around 10 million","Around 1 million","Around 100,000"],ans:2,praise:"Quite right — roughly one million!",comfort:"About one million remain.",fact:"In the 1950s there were an estimated 30 million hedgehogs in Britain. Today conservation groups estimate fewer than one million survive. The main causes are habitat loss, pesticides, and busy roads. A simple hole in a garden fence can help by letting them roam freely."},
{q:"Which colour best describes the eggs of the robin?",opts:["Speckled brown","Plain white","Pale blue with faint reddish speckles","Bright blue"],ans:2,praise:"Well remembered — pale blue with reddish speckles!",comfort:"They are a pale blue with reddish speckles.",fact:"The female robin incubates the eggs alone for 13 to 14 days. Robins may raise two or three broods per year, often beginning as early as March. They are famously bold around gardeners — they have learned over centuries that a spade means earthworms."},
{q:"The osprey returned to breed in Britain in 1954 after an absence of 50 years. At which Scottish loch did it first re-establish itself?",opts:["Loch Ness","Loch Lomond","Loch Garten","Loch Tay"],ans:2,praise:"Spot on — Loch Garten!",comfort:"It was Loch Garten in Speyside.",fact:"The RSPB has guarded the Loch Garten osprey nest continuously since 1954. Ospreys have since spread south — there are now breeding pairs in Wales and northern England. Ospreys migrate all the way from West Africa each spring, sometimes passing over Northumberland on their journey north."},
{q:"Which British butterfly has distinctively jagged, irregular wing edges and a small white comma-shaped mark on its underwings?",opts:["The Painted Lady","The Comma","The Orange Tip","The Brimstone"],ans:1,praise:"Correct — the Comma butterfly!",comfort:"It's the Comma.",fact:"The Comma butterfly was in serious decline by the early 20th century but has made a remarkable recovery and is now spreading northward. The jagged wing edges make it look like a dead leaf when resting, providing excellent camouflage."},
{q:"In which months would you typically expect to first hear a cuckoo calling in northern England?",opts:["January or February","March or April","Late April or May","June or July"],ans:2,praise:"Quite right — late April or May!",comfort:"Cuckoos arrive in late April or May.",fact:"Cuckoos are one of our most eagerly awaited summer visitors — they spend winter in the Congo rainforest and arrive in Britain from late April. Their numbers have declined by 65% since the 1980s, possibly due to declining caterpillar numbers and difficulties on their African migration routes."},
{q:"The delicate wood anemone is an 'ancient woodland indicator plant.' This means it suggests the wood has been continuously wooded for how long?",opts:["At least 100 years","At least 250 years","At least 400 years","At least 1,000 years"],ans:2,praise:"Well done — at least 400 years!",comfort:"It suggests woodland of at least 400 years.",fact:"Wood anemones spread extremely slowly — just a few feet per century — so finding them carpeting a woodland floor is a strong sign that woodland has stood there for many centuries. They are among the first flowers to appear in spring, often poking up through snow."},
{q:"Which common British tree, known in the North of England as the mountain ash, produces brilliant scarlet berries in autumn and was traditionally planted near houses to ward off witches?",opts:["Elder","Blackthorn","Hawthorn","Rowan"],ans:3,praise:"Quite right — the rowan!",comfort:"It's the beautiful rowan tree.",fact:"Rowan trees are remarkably tough and can survive at higher altitudes than almost any other British tree. Their berries are a vital food source for fieldfares, redwings, and mistle thrushes arriving from Scandinavia in autumn."}
],
northeast:[
{q:"The Gateshead Millennium Bridge, which tilts like a blinking eye to allow ships through, won the Stirling Prize for architecture in which year?",opts:["1998","2000","2002","2005"],ans:2,praise:"Quite right — 2002!",comfort:"It won in 2002.",fact:"The Gateshead Millennium Bridge was the world's first tilting bridge. Designed by Wilkinson Eyre Architects, it weighs 800 tonnes and rotates on a horizontal axis in around four minutes. It has become one of the most photographed bridges in Britain."},
{q:"The Venerable Bede, author of the Ecclesiastical History of the English People, completed his masterwork in which year?",opts:["685 AD","731 AD","793 AD","850 AD"],ans:1,praise:"Absolutely right — 731 AD!",comfort:"It was completed in 731 AD.",fact:"Bede spent nearly his entire life at the twin monastery of Wearmouth-Jarrow. He never travelled more than about 50 miles from home, yet his Ecclesiastical History became famous across all of Europe within his own lifetime. He was the first person to use 'AD' dating — his invention."},
{q:"The Lindisfarne Gospels were created on Holy Island around 715 AD by the monk Eadfrith. They are now kept in which London institution?",opts:["The Victoria and Albert Museum","The British Museum","The British Library","The National Gallery"],ans:2,praise:"Well done — the British Library!",comfort:"They are in the British Library.",fact:"The Lindisfarne Gospels have been in London since 1753. There is a strong movement in Northumberland to have them returned — at least on loan — to the North East. A full colour facsimile is displayed at Lindisfarne Castle."},
{q:"Grace Darling's famous rescue took place on 7th September 1838, when she and her father rowed from Longstone lighthouse to save survivors from which wrecked ship?",opts:["SS Great Britain","SS Forfarshire","HMS Victory","SS Great Western"],ans:1,praise:"Absolutely right — the SS Forfarshire!",comfort:"It was the SS Forfarshire.",fact:"Grace Darling was 22 years old and rowed through mountainous seas in the early morning darkness. She became an immediate national celebrity — her portrait was painted by many artists, and she received hundreds of letters and gifts. She died of tuberculosis just four years later, aged 26."},
{q:"The Angel of the North, designed by Antony Gormley and unveiled in 1998, stands 20 metres tall. How wide is its wingspan?",opts:["20 metres","30 metres","54 metres","75 metres"],ans:2,praise:"Well done — 54 metres!",comfort:"Its wingspan is 54 metres.",fact:"The Angel's wingspan of 54 metres is wider than a Boeing 757 aircraft. It weighs 208 tonnes and is built to withstand winds of over 100 miles per hour — its foundations go 20 metres underground. An estimated 90,000 people drive past it every single day."},
{q:"In the Geordie dialect of Tyneside, the word 'canny' is used warmly as a compliment. It most closely means which of the following?",opts:["Very clever","Good, kind, and pleasant","Extremely funny","Brave or bold"],ans:1,praise:"Canny right, pet!",comfort:"It means good, kind, or pleasant.",fact:"'Canny' is one of the most characteristic Geordie words — 'a canny lass' or 'a canny lad' describes someone who is kind, sensible, and decent. It derives from a Scottish Gaelic root meaning 'to know' or 'to be able' — suggesting someone who knows how to behave well."},
{q:"Emperor Hadrian ordered the building of his famous wall during a visit to Britain. In which year did he visit?",opts:["55 BC","78 AD","122 AD","200 AD"],ans:2,praise:"Correct — 122 AD!",comfort:"Hadrian visited in 122 AD.",fact:"Hadrian was a great traveller — he spent more time outside Rome than any other emperor, touring the frontiers of his vast empire. The east end of his wall at Segedunum (Wallsend) had a bath-house and a garrison of several hundred soldiers."},
{q:"The Percy family — Dukes of Northumberland — have owned Alnwick Castle for over 700 years. Since which year?",opts:["1066","1200","1309","1485"],ans:2,praise:"Quite right — since 1309!",comfort:"The Percys have been there since 1309.",fact:"The Percy family are one of the most powerful dynasties in English history — their motto 'Esperance' (Hope) has been their banner since the medieval period. The Duke of Northumberland and his family still live in part of the castle today."},
{q:"The Northumberland Coast was designated an Area of Outstanding Natural Beauty in which decade?",opts:["1940s","1950s","1970s","1990s"],ans:1,praise:"Spot on — in the 1950s!",comfort:"It was designated in the 1950s.",fact:"The Northumberland Coast AONB was designated in 1958. It stretches for 25 miles from Berwick-upon-Tweed to Amble and includes Holy Island, the Farne Islands, Bamburgh, and Dunstanburgh. Its beaches are often empty even in summer."},
{q:"The Jarrow March of 1936 saw 200 unemployed men walk from Jarrow to London to petition Parliament. How many miles did they walk?",opts:["150 miles","200 miles","280 miles","350 miles"],ans:2,praise:"Quite right — 280 miles!",comfort:"They walked approximately 280 miles.",fact:"The Jarrow Crusade took 26 days. The men carried a petition with 11,000 signatures. Despite enormous public sympathy, the government offered them nothing — and the men had to pay their own train fares home. The march has become one of the most enduring symbols of working-class dignity in British history."}
]
};

var topic=null,qs=[],cur=0,score=0,busy=false;
var NAMES={garden:'Gardening',history:'English History',houses:'Historic Houses',radio4:'BBC Radio 4',nature:'Nature & Wildlife',northeast:'The North East'};
var voices=[];
function loadV(){if(window.speechSynthesis)voices=window.speechSynthesis.getVoices();}
if(window.speechSynthesis){loadV();window.speechSynthesis.onvoiceschanged=loadV;}
function speak(txt,cb){
  if(!window.speechSynthesis){if(cb)cb();return;}
  window.speechSynthesis.cancel();
  var u=new SpeechSynthesisUtterance(txt);
  u.rate=0.87;u.pitch=1.06;u.volume=1;
  var v=null;
  for(var i=0;i<voices.length;i++){if(voices[i].lang==='en-GB'&&/kate|serena|amy|emma|female|woman/i.test(voices[i].name)){v=voices[i];break;}}
  if(!v)for(var i=0;i<voices.length;i++){if(voices[i].lang==='en-GB'){v=voices[i];break;}}
  if(!v)for(var i=0;i<voices.length;i++){if(voices[i].lang.indexOf('en')===0){v=voices[i];break;}}
  if(v)u.voice=v;
  var b=document.getElementById('spk-bar');
  if(b)b.classList.add('on');
  u.onend=u.onerror=function(){if(b)b.classList.remove('on');if(cb)cb();};
  window.speechSynthesis.speak(u);
}
function show(id){['s-topic','s-quiz','s-end'].forEach(function(s){var el=document.getElementById(s);el.classList[s===id?'add':'remove']('active');});}
function pick(btn){document.querySelectorAll('.topic-btn').forEach(function(b){b.classList.remove('sel');});btn.classList.add('sel');topic=btn.getAttribute('data-t');document.getElementById('start-btn').disabled=false;}
function startQuiz(){
  if(!topic)return;
  var pool=BANK[topic].slice();
  for(var i=pool.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=pool[i];pool[i]=pool[j];pool[j]=t;}
  qs=pool.slice(0,10);cur=0;score=0;
  document.getElementById('ttag-el').textContent=NAMES[topic];
  show('s-quiz');renderQ();
}
function renderQ(){
  busy=false;
  var q=qs[cur];
  document.getElementById('qcount-el').textContent='Question '+(cur+1)+' of '+qs.length;
  document.getElementById('score-el').textContent='Score: '+score;
  document.getElementById('q-text').textContent=q.q;
  document.getElementById('fb-box').style.display='none';
  var nb=document.getElementById('next-btn');
  nb.style.display='none';nb.textContent='Next Question';
  var g=document.getElementById('opts-grid');
  g.innerHTML='';
  q.opts.forEach(function(o,i){
    var b=document.createElement('button');
    b.className='opt-btn';b.textContent=o;
    b.onclick=(function(idx){return function(){answer(idx);};})(i);
    g.appendChild(b);
  });
  setTimeout(speakQ,550);
}
function speakQ(){
  var q=qs[cur];
  var L=['A','B','C','D'];
  var s='Question '+(cur+1)+'. '+q.q+'  Your four options are: ';
  q.opts.forEach(function(o,i){s+=L[i]+': '+o+'.  ';});
  speak(s);
}
function answer(idx){
  if(busy)return;busy=true;
  var q=qs[cur];
  var ok=(idx===q.ans);
  if(ok)score++;
  document.querySelectorAll('.opt-btn').forEach(function(b,i){
    b.disabled=true;
    if(i===q.ans)b.classList.add('correct');
    else if(i===idx&&!ok)b.classList.add('wrong');
  });
  var emR=['&#127775;','&#127881;','&#10024;','&#127800;','&#127942;','&#11088;'];
  var emW=['&#128144;','&#127804;','&#127808;','&#127803;'];
  function rnd(a){return a[Math.floor(Math.random()*a.length)];}
  var fb=document.getElementById('fb-box');
  fb.className=ok?'correct':'wrong';
  fb.innerHTML='<span class="fb-emoji">'+(ok?rnd(emR):rnd(emW))+'</span>'+'<div class="fb-main">'+(ok?q.praise:q.comfort)+'</div>'+'<div class="fb-fact">'+(ok?'':('The answer was: <strong>'+q.opts[q.ans]+'</strong>. '))+q.fact+'</div>';
  fb.style.display='block';
  var nb=document.getElementById('next-btn');
  nb.style.display='block';
  if(cur>=qs.length-1)nb.textContent='See My Results';
  speak((ok?q.praise:q.comfort+' The correct answer was: '+q.opts[q.ans]+'. ')+q.fact);
}
function nextQ(){window.speechSynthesis&&window.speechSynthesis.cancel();cur++;if(cur>=qs.length)endScreen();else renderQ();}
function endScreen(){
  show('s-end');
  var p=score/qs.length;
  var tr,h,m;
  if(p>=0.9){tr='&#127942;';h='Absolutely Brilliant!';m=score+' out of '+qs.length+' — you really do know your stuff! What a wonderful score.';}
  else if(p>=0.7){tr='&#11088;';h='Jolly Well Done!';m=score+' out of '+qs.length+' — a very impressive effort indeed. You should be very proud!';}
  else if(p>=0.5){tr='&#127800;';h='Good Effort!';m=score+' out of '+qs.length+' — a lovely try. There were some tricky ones in there today!';}
  else{tr='&#128144;';h='How Lovely You Played!';m=score+' out of '+qs.length+' — all good fun, and you will do even better next time!';}
  document.getElementById('trophy-el').innerHTML=tr;
  document.getElementById('end-h').textContent=h;
  document.getElementById('fscore-el').textContent=score+'/'+qs.length;
  document.getElementById('end-msg-el').textContent=m;
  speak(h+' You scored '+score+' out of '+qs.length+'. '+m+'  Press Play Again whenever you are ready!');
}
function reset(){
  window.speechSynthesis&&window.speechSynthesis.cancel();
  topic=null;
  document.querySelectorAll('.topic-btn').forEach(function(b){b.classList.remove('sel');});
  document.getElementById('start-btn').disabled=true;
  show('s-topic');
}
</script>
